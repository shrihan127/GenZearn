<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="find-tutors.html">Find Tutors</a>
        <a href="teach-on-genzearn.html">Teach on GenZearn</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html" class="active">Login</a>
        <a href="terms.html">Terms</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Welcome Back to GenZearn</h2>
    <form id="loginForm">
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn primary">Login</button>
    </form>
    <button type="button" id="forgotPasswordBtn" class="link-btn">Forgot password?</button>
    <div id="forgotPasswordPanel" class="forgot-password-panel hidden">
      <form id="sendCodeForm">
        <input type="email" name="resetEmail" placeholder="Enter your account email" required />
        <button type="submit" class="btn primary">Send verification code</button>
      </form>
      <form id="resetPasswordForm" class="hidden">
        <input type="text" name="verificationCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit verification code" required />
        <input type="password" name="newPassword" minlength="6" placeholder="New password" required />
        <input type="password" name="confirmPassword" minlength="6" placeholder="Confirm new password" required />
        <button type="submit" class="btn primary">Change password</button>
      </form>
      <p id="forgotPasswordStatus" class="status-message" aria-live="polite"></p>
    </div>
    <p id="loginStatus" class="status-message" aria-live="polite"></p>
    <p>Don’t have an account yet? <a href="signup.html">Sign up</a></p>
  </section>

  <footer>
    <p>© 2025 GenZearn. All rights reserved.</p>
    <p class="footer-links"><a href="terms.html">Terms &amp; Conditions</a></p>
  </footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
