<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="connect.html">Find Tutors</a>
        <a href="become-tutor.html">Teach on GenZearn</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html" class="active">Login</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Welcome Back to GenZearn</h2>
    <form id="loginForm">
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn primary">Login</button>
    </form>
    <p id="loginStatus" class="status-message" aria-live="polite"></p>
    <p>Don’t have an account yet? <a href="signup.html">Sign up</a></p>
  </section>

  <footer>
    <p>© 2025 GenZearn</p>
  </footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
