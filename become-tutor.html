<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Tutor | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="logo.png" alt="GenZearn Logo" class="site-logo">
      <span class="tagline">Learn. Earn. Grow.</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="signup.html">Sign Up</a>
      <a href="login.html">Login</a>
      <a href="connect.html">Tutors</a>
    </nav>
  </header>

  <section class="form-section">
    <h2>Become a GenZearn Tutor</h2>
    <p>Share your knowledge and earn by teaching students around the world.</p>
    <form>
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      <input type="text" placeholder="Subjects You Teach" required />
      <textarea placeholder="Brief bio about your experience" required></textarea>
      <button type="submit" class="btn primary">Apply Now</button>
    </form>
  </section>

  <footer>
    <p>© 2025 GenZearn</p>
  </footer>
</body>
</html>
