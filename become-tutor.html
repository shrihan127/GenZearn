<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Tutor | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="connect.html">Find Tutors</a>
        <a href="become-tutor.html" class="active">Teach on GenZearn</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Apply to Teach on GenZearn</h2>
    <p>Tell students what you teach, set your price, and grow your tutoring business with every booking.</p>
    <form>
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      <input type="text" placeholder="Subjects You Teach" required />
      <input type="number" min="5" step="1" placeholder="Your Hourly Rate (USD)" required />
      <input type="text" placeholder="Payment Method (Bank transfer, PayPal, etc.)" required />
      <textarea placeholder="Brief description of your teaching experience" required></textarea>
      <button type="submit" class="btn primary">Submit Tutor Profile</button>
    </form>
  </section>

  <footer>
    <p>© 2025 GenZearn</p>
  </footer>
</body>
</html>
