<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Tutor | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="connect.html">Tutors</a>
        <a href="become-tutor.html" class="active">Become a Tutor</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Join as a Tutor</h2>
    <p>Share your knowledge with students and earn while you teach!</p>
    <form id="tutorApplicationForm">
      <input type="text" name="fullName" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="text" name="subjects" placeholder="Subjects You Teach" required />
      <textarea name="experience" placeholder="Brief Description of Your Experience" required></textarea>
      <button type="submit" class="btn primary">Submit Application</button>
    </form>
    <p id="tutorApplicationStatus" class="status-message" aria-live="polite"></p>
  </section>

  <footer>
    <p>© 2025 GenZearn</p>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
