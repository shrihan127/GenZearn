<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Tutor | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="find-tutors.html">Find Tutors</a>
        <a href="teach-on-genzearn.html" class="active">Teach on GenZearn</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Apply to Teach on GenZearn</h2>
    <p>Tell students what you teach, set your price, and grow your tutoring business with every booking.</p>
    <form id="tutorApplicationForm">
      <input type="text" name="fullName" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="text" name="subjects" placeholder="Subjects You Teach" required />
      <input type="text" name="qualifications" placeholder="Qualifications (Degree, certification, or licensed status)" required />
      <input type="number" name="hourlyRate" min="5" step="1" placeholder="Your Hourly Rate (USD)" required />
      <input type="text" name="paymentMethod" placeholder="Payment Method (Bank transfer, PayPal, etc.)" required />
      <textarea name="experience" placeholder="Brief description of your teaching experience" required></textarea>
      <textarea name="qualificationProof" placeholder="Qualification proof details (issuing body, link, certificate ID, portfolio URL, recent grades, etc.)"></textarea>
      <textarea name="referral" placeholder="Referral (name + contact + why they vouch for you) if you don't have formal qualification"></textarea>
      <button type="submit" class="btn primary">Submit Tutor Profile</button>
    </form>
    <p id="tutorApplicationStatus" class="status-message" aria-live="polite"></p>
  </section>

  <footer>
    <p>© 2025 GenZearn. All rights reserved.</p>
    <p class="footer-links"><a href="terms-and-conditions.html">Terms &amp; Conditions</a></p>
  </footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
