<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Tutors | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="connect.html" class="active">Find Tutors</a>
        <a href="become-tutor.html">Teach on GenZearn</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <section class="hero compact-hero">
    <h2>Book a Tutor by Subject</h2>
    <p>Pick a tutor, request a lesson, and pay securely with clear upfront pricing before you confirm.</p>
  </section>

  <section class="tutors" id="tutorList" aria-live="polite"></section>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Book with <span id="tutorName"></span></h2>
      <form id="sessionRequestForm" onsubmit="submitRequest(event)">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <input id="subjectField" name="topic" type="text" placeholder="Subject / Topic" required />
        <input id="hoursField" name="hours" type="number" min="1" max="8" value="1" required onchange="updateTotal()" oninput="updateTotal()" />
        <select name="paymentMethod" required>
          <option value="" disabled selected>Payment Method</option>
          <option>Credit / Debit Card</option>
          <option>PayPal</option>
          <option>Bank Transfer</option>
        </select>
        <div class="payment-summary">
          <p><strong>Estimated total:</strong> <span id="totalCharge">$0.00</span></p>
        </div>
        <button type="submit" class="btn primary">Confirm & Pay</button>
      </form>
      <p id="sessionRequestStatus" class="status-message" aria-live="polite"></p>
    </div>
  </div>

  <footer>
    <p>© 2025 GenZearn. All rights reserved.</p>
  </footer>

  <script>
    let currentRate = 0;

    function openModal(tutor, rate, subject) {
      document.getElementById('tutorName').textContent = tutor;
      document.getElementById('subjectField').value = subject;
      document.getElementById('hoursField').value = 1;
      currentRate = rate;
      updateTotal();
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function updateTotal() {
      const hours = Number(document.getElementById('hoursField').value || 1);
      const total = currentRate * hours;
      document.getElementById('totalCharge').textContent = `$${total.toFixed(2)}`;
    }

    function submitRequest(event) {
      event.preventDefault();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('modal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
