<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenZearn</title>

    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom right, #007bff, #00c6ff);
        color: white;
        text-align: center;
      }

      header {
        padding: 40px 20px;
        font-size: 36px;
        font-weight: bold;
      }

      p {
        font-size: 18px;
        margin: 10px auto 30px;
        max-width: 600px;
      }

      button {
        background: white;
        color: #007bff;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        margin: 10px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
      }

      button:hover {
        background: #f1f1f1;
      }

      footer {
        margin-top: 60px;
        padding: 20px;
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <header>Welcome to GenZearn</header>

    <p>
      The modern tutoring platform where students and tutors connect instantly —
      like Uber for learning. Learn smarter, teach faster, and grow together.
    </p>

    <button>Find a Tutor</button>
    <button>Become a Tutor</button>

    <footer>© 2025 GenZearn. All rights reserved.</footer>
  </body>
</html>
