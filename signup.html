<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor Profile Form</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7ff;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #d1d5db;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .form-card {
      width: min(760px, 100%);
      background: var(--surface);
      border: 1px solid #e5e7eb;
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      padding: clamp(20px, 4vw, 36px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 2vw, 1.8rem);
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .full-width {
      grid-column: 1 / -1;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    button:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <section class="form-card" aria-labelledby="tutor-form-title">
    <h1 id="tutor-form-title">Tutor Profile Setup</h1>
    <p class="subtitle">Complete your details so students can find the right tutor.</p>

    <form action="#" method="post">
      <div class="grid">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="subjects">Subjects</label>
          <input id="subjects" name="subjects" type="text" placeholder="e.g. Algebra, Biology" required />
        </div>

        <div class="field">
          <label for="hourlyRate">Hourly Rate (USD)</label>
          <input id="hourlyRate" name="hourlyRate" type="number" min="0" step="1" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field full-width">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" placeholder="Tell students about your experience and teaching style." required></textarea>
        </div>

        <div class="field full-width">
          <label for="imageUrl">Profile Image URL (optional)</label>
          <input id="imageUrl" name="imageUrl" type="url" placeholder="https://example.com/photo.jpg" />
        </div>
      </div>

      <button type="submit">Submit</button>
    </form>
  </section>
</body>
</html>
