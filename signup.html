<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="connect.html">Tutors</a>
        <a href="become-tutor.html">Become a Tutor</a>
        <a href="login.html">Login</a>
        <a href="signup.html" class="active">Sign Up</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Create Your Account</h2>
    <form id="signupForm">
      <input type="text" name="fullName" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" minlength="6" required />
      <button type="submit" class="btn primary">Sign Up</button>
    </form>
    <p id="signupStatus" class="status-message" aria-live="polite"></p>
    <p>Already have an account? <a href="login.html">Log in</a></p>
  </section>

  <footer>
    <p>© 2025 GenZearn</p>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
