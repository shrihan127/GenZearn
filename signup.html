<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | GenZearn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GenZearn Logo" class="site-logo">
        <span class="site-name">GenZearn</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="find-tutors.html">Find Tutors</a>
        <a href="teach-on-genzearn.html">Teach on GenZearn</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <a href="signup.html" class="active">Sign Up</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <h2>Create Your GenZearn Account</h2>
    <p>Get started by creating your account details below.</p>
    <form id="signupForm">
      <input type="text" name="fullName" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn primary">Create Account</button>
    </form>
    <p id="signupStatus" class="status-message" aria-live="polite"></p>
    <p>Already have an account? <a href="login.html">Log in</a></p>
  </section>

  <footer>
    <p>© 2025 GenZearn. All rights reserved.</p>
    <p class="footer-links"><a href="terms-and-conditions.html">Terms &amp; Conditions</a></p>
  </footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
